name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  GO_VERSION: '1.26'
  PYTHON_VERSION: '3.12'

jobs:
  # ==================== TESTS ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # User Service Tests
      - name: Test User Service
        run: |
          cd src/Services/UserService
          dotnet test UserService.Tests/UserService.Tests.csproj --verbosity normal

      # Content Service Tests
      - name: Test Content Service
        run: |
          cd src/Services/ContentService
          dotnet test ContentService.Tests/ContentService.Tests.csproj --verbosity normal

      # Social Service Tests
      - name: Test Social Service
        run: |
          cd src/Services/SocialService
          go mod download
          go test -v ./...

      # Feed Service Tests
      - name: Test Feed Service
        run: |
          cd src/Services/FeedService
          go mod download
          go test -v ./...

      # Search Service Tests
      - name: Test Search Service
        run: |
          cd src/Services/SearchService
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/ -v

  # ==================== BUILD ====================
  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/UserService
          file: ./src/Services/UserService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-user-service:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-user-service:${{ github.sha }}

      - name: Build and push Content Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/ContentService
          file: ./src/Services/ContentService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-content-service:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-content-service:${{ github.sha }}

      - name: Build and push Social Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/SocialService
          file: ./src/Services/SocialService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-social-service:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-social-service:${{ github.sha }}

      - name: Build and push Feed Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/FeedService
          file: ./src/Services/FeedService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-feed-service:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-feed-service:${{ github.sha }}

      - name: Build and push Search Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/SearchService
          file: ./src/Services/SearchService/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-search-service:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-search-service:${{ github.sha }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./src/ApiGateway
          file: ./src/ApiGateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/goydagram-api-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/goydagram-api-gateway:${{ github.sha }}

  # ==================== DEPLOY ====================
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/goydagram
            docker compose pull
            docker compose up -d
            docker system prune -f
