apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 30s
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.45.0

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: 'correlation_id'
          matcherRegex: 'correlationId": "([^"]+)"'
          url: '${__value.raw}'
        - name: 'trace_id'
          matcherRegex: 'traceId": "([^"]+)"'
          url: '${__value.raw}'