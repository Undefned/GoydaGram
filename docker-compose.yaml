version: '3.8'

services:
  # ====================================================================
  # USER SERVICE
  # ====================================================================
  user-service:
    build:
      context: ./src/Services/UserService
      dockerfile: Dockerfile
    container_name: goydagram-user-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=user-db;Port=5432;Database=${USER_DB_NAME:-userdb};Username=${USER_DB_USER};Password=${USER_DB_PASSWORD}
      - Redis__ConnectionString=user-redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=goydagram
      - Jwt__Audience=goydagram-users
      - RabbitMQ__ConnectionString=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "5001:8080"
    depends_on:
      user-db:
        condition: service_healthy
      user-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - goydagram-network

  user-db:
    image: postgres:15-alpine
    container_name: goydagram-user-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${USER_DB_USER}
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME:-userdb}
      - TZ=UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME:-userdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - goydagram-network

  user-redis:
    image: redis:7-alpine
    container_name: goydagram-user-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - user_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - goydagram-network

  # ====================================================================
  # SHARED INFRASTRUCTURE
  # ====================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goydagram-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - goydagram-network

  # ====================================================================
  # DEV TOOLS (optional)
  # ====================================================================
  adminer:
    image: adminer:latest
    container_name: goydagram-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - goydagram-network

